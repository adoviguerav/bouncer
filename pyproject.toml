[project]
name = "bouncer"
version = "0.1.0"
description = "Portero de llamadas a herramienta: comprueba cada llamada de un agente antes de ejecutarla y registra quién hizo qué"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
