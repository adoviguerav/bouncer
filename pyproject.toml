[project]
name = "bouncer"
version = "0.1.0"
description = "Tool-call gatekeeper: checks each agent call before executing it and records who did what"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
